[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dnstraking"
version = "1.0.0"
description = "Escáner DNS de reconocimiento y detección de vulnerabilidades"
requires-python = ">=3.8"
dependencies = [
    "dnspython==2.6.1",
    "click==8.1.7",
    "colorama==0.4.6",
    "tabulate==0.9.0",
    "requests==2.31.0",
]

[project.scripts]
dnstraking = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
